# CI / CD - Tests, qualité de code, puis déploiement
#
# - build  : compile les assets Vite une seule fois et les partage via artifact
# - tests / phpstan / pint : contrôles qualité en parallèle
# - deploy : si tout est vert sur main (push), envoie les assets buildés sur le
#            serveur via SSH et met à jour le projet
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   - SSH_HOST : adresse IP ou domaine du serveur
#   - SSH_USER : utilisateur SSH (ex: deploy)
#   - SSH_KEY  : clé privée SSH ed25519
#   - SSH_PORT : port SSH (si différent de 22)
#   - SSH_PATH : chemin du projet sur le serveur
#                (ex: /srv/d_sajama/www/markdown2spip.orsal.fr)

name: CI / CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build assets
        run: npm ci && npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build/
          retention-days: 1

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create .env file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create mentions-legales from template
        run: cp resources/views/mentions-legales.EXAMPLE.blade.php resources/views/mentions-legales.blade.php

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build/

      - name: Run tests
        run: php artisan test

  phpstan:
    name: PHPStan (Level 6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create mentions-legales from template
        run: cp resources/views/mentions-legales.EXAMPLE.blade.php resources/views/mentions-legales.blade.php

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=256M

  pint:
    name: Laravel Pint (Code Style)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [tests, phpstan, pint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build/

      - name: Clean old build assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -rf ${{ secrets.SSH_PATH }}/public/build/

      - name: Transfer built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/"
          target: ${{ secrets.SSH_PATH }}
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            umask 002
            cd ${{ secrets.SSH_PATH }}

            php artisan down --retry=60 || true

            git checkout -- .
            git pull --ff-only origin main

            printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cI)" > VERSION

            rm -f bootstrap/cache/*.php
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan optimize:clear

            php artisan up
