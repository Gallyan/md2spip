name: Tests & Quality

on:
  # Lancement manuel depuis l'interface GitHub
  workflow_dispatch:

  # Déclenchements automatiques sur la branche main
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create .env file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create mentions-legales from template
        run: cp resources/views/mentions-legales.EXAMPLE.blade.php resources/views/mentions-legales.blade.php

      - name: Install Node.js dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  phpstan:
    name: PHPStan (Level 6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create mentions-legales from template
        run: cp resources/views/mentions-legales.EXAMPLE.blade.php resources/views/mentions-legales.blade.php

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=256M

