# Continuous Deployment - Déploiement automatique sur VPS
#
# Se déclenche après le succès du CI sur main, ou manuellement via workflow_dispatch.
# Les assets sont buildés ici puis transférés sur le serveur (pas de Node en prod).
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   - SSH_HOST : adresse IP ou domaine du serveur
#   - SSH_USER : utilisateur SSH (ex: deploy)
#   - SSH_KEY  : clé privée SSH ed25519
#   - SSH_PORT : port SSH (si différent de 22)
#   - SSH_PATH : chemin du projet sur le serveur
#   - SSH_HOST_KEY : clé publique d'hôte du serveur, soit le contenu de
#     /etc/ssh/ssh_host_ed25519_key.pub (la connexion échoue si elle ne correspond pas)
#
# Prérequis serveur :
#   - /usr/local/bin/restart-php-fpm : script root-owned (chmod 755) qui restarte
#     tous les pools php*-fpm pour purger l'OPcache après déploiement (le reload
#     ne le vide pas). Ne touche NI Apache NI MySQL.
#   - sudoers : deploy autorisé à `/usr/local/bin/restart-php-fpm` sans mot de passe
#     (sinon workers FPM en erreur 503 après déploiement)

name: CD
run-name: "CD — ${{ github.event_name == 'workflow_dispatch' && 'manual' || format('{0}: {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_commit.message) }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Build assets
        run: npm ci && npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-assets
          path: public/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-assets
          path: public/build

      - name: Check built assets
        run: test -f public/build/manifest.json

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          : "${SSH_HOST_KEY:?secret SSH_HOST_KEY manquant}"

          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key)
          printf 'production %s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host production
              HostName $SSH_HOST
              Port ${SSH_PORT:-22}
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              HostKeyAlias production
              StrictHostKeyChecking yes
              ConnectTimeout 30
              ServerAliveInterval 30
          EOF

      - name: Clean old build assets
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: ssh -n production "rm -rf $(printf %q "$SSH_PATH")/public/build"

      - name: Transfer built assets to server
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: scp -r public/build "production:$SSH_PATH/public/"

      - name: Deploy to server
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          script=$(cat <<'EOF'
          umask 002

          php artisan down --retry=60 || true
          trap 'php artisan up' EXIT

          git checkout -- .
          git pull --ff-only origin main

          printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cI)" > VERSION

          rm -f bootstrap/cache/*.php
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          php artisan optimize:clear

          sudo /usr/local/bin/restart-php-fpm
          EOF
          )

          ssh -n production "set -e
          cd $(printf %q "$SSH_PATH")
          $script"
