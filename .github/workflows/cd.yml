# Continuous Deployment - Déploiement automatique sur VPS
#
# Se déclenche après le succès du CI sur main, ou manuellement via workflow_dispatch.
# Les assets sont buildés ici puis transférés sur le serveur (pas de Node en prod).
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   - SSH_HOST : adresse IP ou domaine du serveur
#   - SSH_USER : utilisateur SSH (ex: deploy)
#   - SSH_KEY  : clé privée SSH ed25519
#   - SSH_PORT : port SSH (si différent de 22)
#   - SSH_PATH : chemin du projet sur le serveur
#
# Prérequis serveur :
#   - /usr/local/bin/restart-php-fpm : script root-owned (chmod 755) qui restarte
#     tous les pools php*-fpm pour purger l'OPcache après déploiement (le reload
#     ne le vide pas). Ne touche NI Apache NI MySQL.
#   - sudoers : deploy autorisé à `/usr/local/bin/restart-php-fpm` sans mot de passe
#     (sinon workers FPM en erreur 503 après déploiement)

name: CD
run-name: "CD — ${{ github.event_name == 'workflow_dispatch' && 'manual' || format('{0}: {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_commit.message) }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Build assets
        run: npm ci && npm run build

      - name: Clean old build assets
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -rf ${{ secrets.SSH_PATH }}/public/build/

      - name: Transfer built assets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/"
          target: ${{ secrets.SSH_PATH }}
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            umask 002
            cd ${{ secrets.SSH_PATH }}

            php artisan down --retry=60 || true

            git checkout -- .
            git pull --ff-only origin main

            printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cI)" > VERSION

            rm -f bootstrap/cache/*.php
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan optimize:clear

            sudo /usr/local/bin/restart-php-fpm

            php artisan up
